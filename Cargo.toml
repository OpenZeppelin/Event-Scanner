[package]
name = "event-scanner"
description = "Event Scanner is a library for scanning events from any EVM-based blockchain."
categories = [
    "asynchronous",
    "web-programming",
    "web-programming::websocket",
    "cryptography::cryptocurrencies",
]
keywords = ["evm", "ethereum", "blockchain", "events", "alloy"]
authors = ["OpenZeppelin"]
edition = "2024"
license = "MIT"
repository = "https://github.com/OpenZeppelin/Event-Scanner"
version = "1.0.0"
publish = true

[dependencies]
alloy = { version = "1.1.2", features = ["full"] }
alloy-node-bindings = "1.1.2"
tokio = { version = "1.48", features = ["full"] }
futures = "0.3.31"
anyhow = "1.0"
thiserror = "2.0.17"
tokio-stream = "0.1.17"
tracing = "0.1"
robust-provider = "0.2.0"
tokio-util = "0.7.17"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
test-log = { version = "0.2.18", features = ["trace"] }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
pedantic = "warn"
all = "warn"

[features]
test-utils = []
tracing = []
