[package]
name = "event-scanner"
description = "Event Scanner is a library for scanning events from any EVM-based blockchain."
categories = [
    "asynchronous",
    "web-programming",
    "web-programming::websocket",
    "cryptography::cryptocurrencies",
]
keywords = ["evm", "ethereum", "blockchain", "events", "alloy"]
authors = ["OpenZeppelin"]
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/OpenZeppelin/Event-Scanner"
documentation = "https://docs.rs/event-scanner"
version = "1.0.0"
publish = true
exclude = [".github/", ".vscode/", ".config/", ".cargo/", "benches/", "tests/"]

[dependencies]
alloy = { version = "1.1.2" }
tokio = { version = "1.48" }
futures = "0.3.31"
anyhow = "1.0"
thiserror = "2.0.17"
tokio-stream = "0.1.17"
tracing = "0.1"
robust-provider = "0.2.0"
tokio-util = "0.7.17"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
flate2 = { version = "1.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
test-log = { version = "0.2.18", features = ["trace"] }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
pedantic = "warn"
all = "warn"

[[bench]]
name = "historic_scanning"
harness = false
required-features = ["bench-utils"]

[[bench]]
name = "latest_events_scanning"
harness = false
required-features = ["bench-utils"]

# uncomment only when new dumps need to be generated, see CONTRIBUTING.md
# [[bin]]
# name = "generate_dump"
# path = "benches/generate_dump.rs"
# required-features = ["bench-utils"]

[features]
test-utils = ["alloy/node-bindings"]
tracing = []
bench-utils = [
    "dep:serde",
    "dep:serde_json",
    "dep:flate2",
    "alloy/node-bindings",
]

[profile.release]
lto = "thin"
panic = "abort"
codegen-units = 1
strip = true
