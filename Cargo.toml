[package]
name = "event-scanner"
description = "Event Scanner is a library for scanning events from any EVM-based blockchain."
categories = [
    "asynchronous",
    "web-programming",
    "web-programming::websocket",
    "cryptography::cryptocurrencies",
]
keywords = ["evm", "ethereum", "blockchain", "events", "alloy"]
authors = ["OpenZeppelin"]
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/OpenZeppelin/Event-Scanner"
documentation = "https://docs.rs/event-scanner"
version = "1.1.0"
publish = true
exclude = [
    ".github/",
    ".vscode/",
    ".config/",
    ".cargo/",
    "benches/",
    "tests/",
    "bin/generate_dump.rs",
]

[dependencies]
alloy = { version = "1.1.2", default-features = false }
tokio = { version = "1.48", features = ["rt-multi-thread"] }
futures = { version = "0.3.31", default-features = false }
thiserror = "2.0.17"
tokio-stream = { version = "0.1.17", default-features = false }
robust-provider = "1.0.0"

anyhow = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
flate2 = { version = "1.1", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
alloy = { version = "1.1.2", features = ["node-bindings", "provider-ws", "rpc-types-anvil"] }
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
test-log = { version = "0.2.18", features = ["trace"] }

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
pedantic = "warn"
all = "warn"

[[bench]]
name = "historic_scanning"
harness = false
required-features = ["bench-utils"]

[[bench]]
name = "latest_events_scanning"
harness = false
required-features = ["bench-utils"]

[[bin]]
name = "generate_dump"
path = "bin/generate_dump.rs"
required-features = ["bench-utils"]

[[example]]
name = "historical_scanning"
path = "examples/historical_scanning.rs"
required-features = ["example"]

[[example]]
name = "latest_events_scanning"
path = "examples/latest_events_scanning.rs"
required-features = ["example"]

[[example]]
name = "live_scanning"
path = "examples/live_scanning.rs"
required-features = ["example"]

[[example]]
name = "live_scanning_http"
path = "examples/live_scanning_http.rs"
required-features = ["example", "http-subscription"]

[[example]]
name = "sync_from_block_scanning"
path = "examples/sync_from_block_scanning.rs"
required-features = ["example"]

[[example]]
name = "sync_from_latest_scanning"
path = "examples/sync_from_latest_scanning.rs"
required-features = ["example"]

[features]
test-utils = ["dep:anyhow"]
tracing = ["dep:tracing"]
bench-utils = [
    "dep:anyhow",
    "dep:serde",
    "dep:serde_json",
    "dep:flate2",
    "dep:tracing",
    "alloy/node-bindings",
]
example = ["tracing", "dep:anyhow"]
http-subscription = ["robust-provider/http-subscription"]

[profile.release]
lto = "thin"
panic = "abort"
codegen-units = 1
strip = true
