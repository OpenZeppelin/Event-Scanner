rules:
  cache-poisoning:
    # These workflows do not publish anything, so a poisoned cache cannot reach a
    # release. publish.yml, which does publish, runs with caching disabled.
    ignore:
      - base_benchmarks.yml
      - check.yml
      - test.yml
  unpinned-uses:
    config:
      policies:
        # Bencher recommends tracking `main`, because a CLI that lags behind its
        # API can fail benchmark runs.
        # https://bencher.dev/docs/how-to/github-actions/
        "bencherdev/bencher": ref-pin
        "*": hash-pin
  dependabot-cooldown:
    # Updates are applied as soon as Dependabot proposes them.
    ignore:
      - dependabot.yml
