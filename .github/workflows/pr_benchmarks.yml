name: PR Benchmarks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"

# If new code is pushed to a PR branch, then cancel in progress workflows for
# that PR. Ensures that we don't waste CI time, and returns results quicker.
# https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: "Continuous PR Benchmarking: ${{ matrix.suite }}"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        suite:
          - historic_scanning
          - latest_events_scanning

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # Pin to the anvil version used to generate benches/dumps/state_*.json.gz
          # (see anvil_version in benches/dumps/state_*.metadata.json). Anvil's
          # state-dump JSON is not version-compatible: loading a dump with a
          # different version fails with SerializableTransactionType / missing
          # field errors. Bump this together with the regenerated dump files.
          version: v1.7.0

      - name: Setup Bencher
        # With the default `version` input, the action installs the CLI bundled with
        # that commit, so this SHA also pins the Bencher CLI. Bencher's docs
        # recommend `main` because a CLI that lags behind Bencher's API can
        # fail benchmark runs; Dependabot proposes each new release, so keep
        # this pin up to date.
        # https://bencher.dev/docs/how-to/github-actions/
        uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16

      - name: Prepare benchmark state
        run: |
          gunzip -kf benches/dumps/*.json.gz
          ls -lh benches/dumps/

      - name: Run benchmark
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --token "$BENCHER_API_TOKEN" \
            --branch "$HEAD_REF" \
            --testbed ubuntu-latest \
            --adapter rust_criterion \
            --start-point "$BASE_REF" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --github-actions "$GITHUB_TOKEN" \
            --err \
            "cargo bench --bench ${{ matrix.suite }} --features bench-utils"
